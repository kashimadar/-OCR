<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会計OCRアプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; background: #f0f2f5; color: #333; font-size: 14px; }

    /* Header */
    .header { background: #1a2942; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; box-shadow: 0 2px 6px rgba(0,0,0,0.25); }
    .header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
    .api-key-group { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    .api-key-group label { font-size: 0.85rem; white-space: nowrap; color: #cdd5e0; }
    .api-key-group input { padding: 7px 10px; border: 1px solid #4a5568; border-radius: 5px; background: #2d3e55; color: #fff; width: 260px; font-size: 0.85rem; }
    .api-key-group input::placeholder { color: #8899aa; }
    .btn-save-key { padding: 7px 14px; background: #3b82f6; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; transition: background 0.15s; }
    .btn-save-key:hover { background: #2563eb; }

    /* Tabs */
    .tabs { background: #fff; border-bottom: 2px solid #e2e8f0; display: flex; padding: 0 20px; gap: 4px; }
    .tab-btn { padding: 12px 22px; border: none; background: none; cursor: pointer; font-size: 0.95rem; color: #718096; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color 0.15s; font-weight: 500; }
    .tab-btn:hover { color: #2d3748; }
    .tab-btn.active { color: #1a2942; border-bottom-color: #3b82f6; font-weight: 700; }

    /* Content */
    .content { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Upload Area */
    .upload-area { display: block; border: 2px dashed #cbd5e0; border-radius: 10px; padding: 44px 24px; text-align: center; background: #fff; cursor: pointer; transition: border-color 0.2s, background 0.2s; user-select: none; }
    .upload-area:hover, .upload-area.dragover { border-color: #3b82f6; background: #eff6ff; }
    .upload-icon { font-size: 3rem; margin-bottom: 12px; display: block; }
    .upload-area p { color: #718096; margin: 4px 0; line-height: 1.6; }
    .upload-area strong { color: #2d3748; }
    .upload-area input[type=file] { display: none; }
    .btn-select-file { display: inline-block; margin-top: 14px; padding: 9px 22px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: background 0.15s; }
    .btn-select-file:hover { background: #2563eb; }

    /* Progress */
    .progress-area { background: #fff; border-radius: 8px; padding: 18px 20px; margin: 14px 0; display: none; border: 1px solid #e2e8f0; }
    .progress-text { font-size: 0.9rem; color: #4a5568; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .progress-bar-wrap { background: #e2e8f0; border-radius: 99px; height: 7px; overflow: hidden; }
    .progress-bar { background: #3b82f6; height: 7px; border-radius: 99px; transition: width 0.35s ease; width: 0%; }

    /* Results */
    .results-area { background: #fff; border-radius: 10px; padding: 20px; margin: 14px 0; display: none; border: 1px solid #e2e8f0; }
    .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .results-header h3 { font-size: 1rem; color: #2d3748; }
    .btn-download { padding: 8px 18px; background: #059669; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: background 0.15s; }
    .btn-download:hover { background: #047857; }
    .btn-clear { padding: 6px 14px; background: #e53e3e; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 0.85rem; transition: background 0.15s; }
    .btn-clear:hover { background: #c53030; }
    .action-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }

    /* Table */
    .table-wrap { overflow-x: auto; border-radius: 6px; border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    thead th { background: #f7fafc; padding: 9px 12px; text-align: left; border-bottom: 2px solid #e2e8f0; font-weight: 700; white-space: nowrap; color: #4a5568; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; }
    tbody td { padding: 7px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafbfc; }
    td[contenteditable=true] { outline: none; cursor: text; }
    td[contenteditable=true]:focus { background: #fffbeb; box-shadow: inset 0 0 0 2px #f59e0b; }
    tr.row-error { background: #fff5f5 !important; }
    tr.row-error td { color: #c53030; }
    .check-ok { color: #059669; font-weight: 700; }
    .check-ng { color: #e53e3e; font-weight: 700; }

    /* Alerts */
    .alert { padding: 11px 16px; border-radius: 7px; margin: 10px 0; font-size: 0.9rem; line-height: 1.5; }
    .alert-error { background: #fff5f5; color: #c53030; border: 1px solid #fed7d7; }
    .alert-info { background: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; }
    .alert-warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }

    /* Spinner */
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2.5px solid #cbd5e0; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.75s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Abort button */
    .btn-abort { padding: 5px 12px; background: #e53e3e; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 0.82rem; font-weight: 700; white-space: nowrap; }
    .btn-abort:hover { background: #c53030; }
    /* Cost badge */
    .cost-badge { font-size: 0.82rem; color: #718096; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 5px; padding: 3px 10px; }
    /* Misc */
    .tip { font-size: 0.82rem; color: #a0aec0; margin-top: 4px; }
    .count-badge { background: #3b82f6; color: #fff; border-radius: 99px; padding: 2px 8px; font-size: 0.78rem; font-weight: 700; margin-left: 6px; }
    .elapsed-badge { font-size: 0.82rem; color: #718096; margin-left: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    tr.row-autofix { background: #fffbeb !important; }
    tr.row-autofix td { color: #92400e; }
    tr.row-confirm { background: #fff5f5 !important; }
    tr.row-confirm td { color: #c53030; }
    .check-fix { color: #d97706; font-weight: 700; cursor: help; border-bottom: 1px dashed #d97706; white-space: nowrap; }
    .check-confirm { color: #e53e3e; font-weight: 700; }
    #receipt-warn-tbody tr { background: #fff5f5; }
    #receipt-warn-tbody tr:hover { background: #fed7d7 !important; }
    #receipt-warn-tbody td { color: #9b2c2c; }
    .receipt-flag { display: inline-block; font-size: 0.73rem; font-weight: 700; color: #c53030; background: #fed7d7; border-radius: 3px; padding: 1px 5px; white-space: nowrap; vertical-align: middle; cursor: default; border: 1px solid #fc8181; }
    .btn-row-del { padding: 2px 7px; font-size: 0.8rem; background: #fed7d7; color: #c53030; border: 1px solid #fc8181; border-radius: 4px; cursor: pointer; line-height: 1.4; }
    .btn-row-del:hover { background: #fc8181; color: #fff; }
    .btn-row-ins { padding: 2px 7px; font-size: 0.8rem; background: #e6fffa; color: #2c7a7b; border: 1px solid #81e6d9; border-radius: 4px; cursor: pointer; line-height: 1.4; margin-right: 3px; }
    .btn-row-ins:hover { background: #81e6d9; color: #234e52; }
  </style>
</head>

<!-- ===== SCRIPTS ===== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';

// ─── Config ───────────────────────────────────────────────
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const GEMINI_MODEL    = 'gemini-2.5-flash';
const GEMINI_ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
const REQUEST_DELAY   = 300;
// Gemini 2.5 Flash 料金 (USD/1M tokens) ※ Standard Tier
// 参照: https://ai.google.dev/gemini-api/docs/pricing
const PRICE_INPUT  = 0.30;  // テキスト・画像・動画
const PRICE_OUTPUT = 1.00;  // 出力（Thinking無効時）
const JPY_RATE     = 150;   // 円換算レート（概算）

let abortFlag = false;
let tabCost   = { receipt: 0, bankbook: 0, card: 0 }; // USD
let _timerInterval = null;
let _timerStart    = null;
let _timerTab      = null;

function startTimer(tab) {
  clearInterval(_timerInterval);
  _timerStart = Date.now();
  _timerTab   = tab;
  const el = document.getElementById(tab + '-elapsed');
  if (el) el.textContent = '⏱ 0秒';
  _timerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - _timerStart) / 1000);
    const e = document.getElementById(_timerTab + '-elapsed');
    if (e) e.textContent = `⏱ ${s}秒`;
  }, 500);
}

function stopTimer() {
  clearInterval(_timerInterval);
  _timerInterval = null;
}

function abortProcessing() {
  abortFlag = true;
}

function resetAbort() {
  abortFlag = false;
}

function addCost(tab, inputTokens, outputTokens) {
  tabCost[tab] += (inputTokens * PRICE_INPUT + outputTokens * PRICE_OUTPUT) / 1_000_000;
}

function formatCost(usd) {
  const jpy = Math.round(usd * JPY_RATE);
  if (usd < 0.001) return '< $0.001 (< ¥1)';
  return `$${usd.toFixed(4)} (約¥${jpy})`;
}

function updateCostBadge(tab) {
  const el = document.getElementById(tab + '-cost');
  if (el) el.innerHTML = `API利用料: ${formatCost(tabCost[tab])} <a href="https://ai.google.dev/gemini-api/docs/pricing" target="_blank" style="color:#3b82f6;font-size:0.78rem">料金表</a>`;
}

// ─── Startup ──────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('gemini_api_key');
  if (saved) document.getElementById('apiKeyInput').value = saved;

  setupDrop('receipt-drop',  'receipt-file',  handleReceiptUpload);
  setupDrop('bankbook-drop', 'bankbook-file', handleBankbookUpload);
  setupDrop('card-drop',     'card-file',     handleCardUpload);
});

function saveApiKey() {
  const k = document.getElementById('apiKeyInput').value.trim();
  if (!k) { alert('APIキーを入力してください'); return; }
  localStorage.setItem('gemini_api_key', k);
  const btn = document.querySelector('.btn-save-key');
  const orig = btn.textContent;
  btn.textContent = '✓ 保存済';
  setTimeout(() => btn.textContent = orig, 1500);
}

function getApiKey() {
  return localStorage.getItem('gemini_api_key') ||
         document.getElementById('apiKeyInput').value.trim();
}

// ─── Tab switching ────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

// ─── Drag & Drop ─────────────────────────────────────────
function setupDrop(dropId, fileId, handler) {
  const zone = document.getElementById(dropId);
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('dragover'); });
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handler({ target: { files: e.dataTransfer.files } });
  });
}

// ─── PDF → base64 images ─────────────────────────────────
async function pdfToImages(file, scale = 2.0) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const images = [];
  for (let pg = 1; pg <= pdf.numPages; pg++) {
    const page     = await pdf.getPage(pg);
    const viewport = page.getViewport({ scale });
    const canvas   = document.createElement('canvas');
    canvas.width   = viewport.width;
    canvas.height  = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    images.push(canvas.toDataURL('image/jpeg', 0.88).split(',')[1]);
  }
  return images;
}

async function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function fileMime(file) {
  if (file.type) return file.type;
  const ext = file.name.toLowerCase().split('.').pop();
  return ({ jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png',
            gif: 'image/gif', webp: 'image/webp', pdf: 'application/pdf' })[ext] || 'image/jpeg';
}

async function fileToImages(file) {
  const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  if (isPdf) {
    const imgs = await pdfToImages(file);
    return imgs.map(d => ({ data: d, mime: 'image/jpeg' }));
  }
  const data = await fileToBase64(file);
  return [{ data, mime: fileMime(file) }];
}

// ─── Gemini API ───────────────────────────────────────────
async function callGemini(prompt, imageData, imageMime, retries = 3, tab = null, thinkingBudget = 8192) {
  const key = getApiKey();
  if (!key) throw new Error('Gemini APIキーが未設定です。ヘッダーのAPIキー欄に入力して「保存」してください。');

  const body = {
    contents: [{ parts: [
      { text: prompt },
      { inline_data: { mime_type: imageMime, data: imageData } }
    ]}],
    generationConfig: { temperature: 0, thinkingConfig: { thinkingBudget } }
  };

  for (let attempt = 0; attempt <= retries; attempt++) {
    const res = await fetch(`${GEMINI_ENDPOINT}?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const msg = err.error?.message || `HTTP ${res.status}`;
      if (res.status === 401 || res.status === 403) throw new Error(`APIキーが無効または権限がありません: ${msg}`);
      // Retryable errors: rate limit or high demand
      const isRetryable = res.status === 429 || res.status === 503 || msg.includes('high demand') || msg.includes('overloaded');
      if (isRetryable && attempt < retries) {
        const wait = res.status === 429 ? 3000 : (attempt + 1) * 5000;
        await sleep(wait);
        continue;
      }
      throw new Error(`Gemini APIエラー: ${msg}`);
    }

    const data = await res.json();

    // トークン集計（Thinking トークンも出力に含める）
    const usage = data.usageMetadata;
    if (usage && tab) {
      const outTokens = (usage.candidatesTokenCount || 0) + (usage.thoughtsTokenCount || 0);
      addCost(tab, usage.promptTokenCount || 0, outTokens);
      updateCostBadge(tab);
    }

    // Safety block check
    const finishReason = data.candidates?.[0]?.finishReason;
    if (finishReason && finishReason !== 'STOP' && finishReason !== 'MAX_TOKENS') {
      throw new Error(`Geminiが応答をブロックしました (${finishReason})`);
    }

    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    if (!text) throw new Error('Geminiから空の応答が返されました');

    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error(`JSONが見つかりません。応答: ${text.slice(0, 100)}`);
    try {
      return JSON.parse(jsonMatch[0]);
    } catch (e) {
      throw new Error(`JSON解析失敗: ${e.message} / 応答: ${text.slice(0, 100)}`);
    }
  }
}

// ─── Progress helpers ─────────────────────────────────────
function showProgress(tab, msg, pct) {
  const area = document.getElementById(tab + '-progress');
  area.style.display = 'block';
  document.getElementById(tab + '-progress-msg').textContent = msg;
  document.getElementById(tab + '-progress-bar').style.width = pct + '%';
}
function hideProgress(tab) {
  document.getElementById(tab + '-progress').style.display = 'none';
  stopTimer();
}
function showError(tab, msg) {
  document.getElementById(tab + '-error').innerHTML =
    `<div class="alert alert-error">⚠ ${esc(msg)}</div>`;
}
function clearError(tab) {
  document.getElementById(tab + '-error').innerHTML = '';
}

// ─── Utilities ────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// カタカナの濁点・半濁点を結合（ホ゛→ボ、ハ゜→パ 等）
function normalizeText(s) {
  return s ? String(s).normalize('NFC') : '';
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function num(v) { return v != null && v !== '' ? v : ''; }

function bindEditable(tbody, dataArray) {
  tbody.querySelectorAll('td[contenteditable=true]').forEach(td => {
    td.addEventListener('blur', () => {
      const idx   = parseInt(td.dataset.idx);
      const field = td.dataset.field;
      if (dataArray[idx]) dataArray[idx][field] = td.textContent.trim();
    });
  });
}

// ─── CSV export ───────────────────────────────────────────
function csvField(v) {
  const s = String(v ?? '');
  return (s.includes(',') || s.includes('"') || s.includes('\n'))
    ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadFile(content, filename) {
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

  "tax_class": "課税区分を以下から1つ選ぶ: '10'=標準税率10%のみ / '8'=軽減税率8%のみ（食品・新聞等） / 'mixed'=10%と8%が混在 / 'nontax'=非課税 / 'unknown'=判断できない",
  "amount_10": "10%対象税込金額 数値のみ、なければnull",
  "amount_8": "8%対象税込金額 数値のみ、なければnull",
  "amount_total": "合計税込金額 数値のみ"
}

注意：
- 金額はカンマなし数値のみ
- tax_classが'mixed'の場合はamount_10とamount_8の両方を必ず記入
- tax_classが'nontax'の場合はis_nontaxもtrueにすること
- 税率区別が明示されていない場合はamount_totalのみ、amount_10/8はnull
- レシート以外のページはすべてnullで返す`;

let receiptData = [];

// 日付の妥当性チェック: 'ok' | 'no_date' | 'invalid' | 'future' | 'old'
function validateReceiptDate(dateStr) {
  if (!dateStr || String(dateStr).trim() === '') return 'no_date';
  const m = String(dateStr).match(/^(\d{4})\/(\d{2})\/(\d{2})$/);
  if (!m) return 'invalid';
  const d = new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
  if (isNaN(d.getTime())) return 'invalid';
  const now = new Date();
  const fiveYearsAgo = new Date(now.getFullYear() - 5, now.getMonth(), now.getDate());
  if (d > now)           return 'future';
  if (d < fiveYearsAgo)  return 'old';
  return 'ok';
}

function receiptToRows(result) {
  // 金額・日付がすべてnull → レシートなし
  if (result.date == null && result.amount_total == null &&
      result.amount_10 == null && result.amount_8 == null) return null;

  const store        = normalizeText(result.store_name);
  const purpose      = result.purpose ? normalizeText(result.purpose.trim()) : null;
  const renban       = result.renban != null ? String(result.renban) : null;
  const invoiceClass = result.invoice_number ? '' : '区分記載';
  // 0 は「記載なし」扱い
  const amount10 = (result.amount_10 != null && result.amount_10 !== 0) ? result.amount_10 : null;
  const amount8  = (result.amount_8  != null && result.amount_8  !== 0) ? result.amount_8  : null;
  const isMixed      = amount10 != null && amount8 != null;
  const hasAmount    = result.amount_total != null || amount10 != null || amount8 != null;
  const date         = result.date ?? '';

  // tax_class 優先、なければ is_nontax からフォールバック
  const taxClass = result.tax_class
    ?? (result.is_nontax ? 'nontax' : 'unknown');

  // 日付・金額・用途バリデーション → flagフィールドに記録
  const dateStatus = validateReceiptDate(date);
  let flag = null;
  if (dateStatus !== 'ok')  flag = dateStatus;
  else if (!hasAmount)      flag = 'no_amount';

  const purposeText = purpose ?? '';

  function desc(taxLabel) {
    let s = store;
    if (purposeText) s += ` ${purposeText}`;
    if (isMixed) {
      s += ` ${taxLabel}分`;
      if (renban) s += ` 一連${renban}`;
    }
    // 税区分サフィックス
    if (taxLabel === '8%') {
      s += '（軽減8%）';
    } else if (taxLabel !== '10%') {
      // 単一行の場合
      if      (taxClass === 'nontax')  s += '（非課税）';
      else if (taxClass === '8')       s += '（軽減8%）';
      else if (taxClass === 'unknown') s += '（課税区分不明）';
    }
    return s;
  }

  if (isMixed) {
    return [
      { date, description: desc('10%'), amount: amount10, reduced_tax: '',  invoice_class: invoiceClass, flag },
      { date, description: desc('8%'),  amount: amount8,  reduced_tax: '※', invoice_class: invoiceClass, flag }
    ];
  }
  // 片方だけ残っている場合（もう一方が0だった）はその値を使う
  const singleAmount = result.amount_total ?? amount10 ?? amount8;
  return [
    { date, description: desc(''), amount: singleAmount, reduced_tax: amount8 != null ? '※' : '', invoice_class: invoiceClass, flag }
  ];
}

async function handleReceiptUpload(event) {
  const files = Array.from(event.target.files);
  event.target.value = '';
  if (!files.length) return;

  clearError('receipt');
  receiptData = [];
  tabCost.receipt = 0;
  resetAbort();
  startTimer('receipt');

  try {
    // ── Phase 1: 全ページを一括で canvas → base64 変換 ──────────
    const allImgs = [];
    for (const f of files) {
      showProgress('receipt', `変換中: ${f.name}`, 5);
      const imgs = await fileToImages(f);
      allImgs.push(...imgs);
    }

    const total = allImgs.length;
    if (total === 0) throw new Error('画像を取得できませんでした');

    showProgress('receipt', `0 / ${total} ページ完了`, 10);

    // ── Phase 2: 3件ずつ並列送信・返ってきた順にテーブル追加 ──────
    const BATCH_SIZE = 5;
    let   completed  = 0;
    const pageErrors = [];
    const seenKeys   = new Set(); // 両面スキャン重複除外

    const processOne = async (img, pageNum) => {
      if (abortFlag) return;
      try {
        const result = await callGemini(RECEIPT_PROMPT, img.data, img.mime, 3, 'receipt', 512);
        if (abortFlag) return;

        const rows = receiptToRows(result);
        if (!rows) return;

        // 両面スキャン重複除外（日付・店名・金額が同一なら skip）
        const key = `${result.date}_${result.store_name}_${result.amount_total ?? result.amount_10}`;
        if (seenKeys.has(key)) return;
        seenKeys.add(key);

        receiptData.push(...rows);
        renderReceiptTable(); // 返ってきた順に随時追加表示
      } catch (e) {
        if (e.message.includes('APIキー') || e.message.includes('無効')) throw e;
        pageErrors.push(`ページ ${pageNum}: ${e.message}`);
      }
    };

    for (let i = 0; i < total; i += BATCH_SIZE) {
      if (abortFlag) break;

      const slice = allImgs.slice(i, Math.min(i + BATCH_SIZE, total));
      await Promise.all(
        slice.map((img, bi) =>
          processOne(img, i + bi + 1).finally(() => {
            completed++;
            const pct = Math.round(10 + (completed / total) * 85);
            showProgress('receipt', `${completed} / ${total} ページ完了`, pct);
          })
        )
      );
    }

    showProgress('receipt',
      abortFlag ? `中止（${completed} / ${total} 完了）` : `完了（${total} ページ）`, 100);
    await sleep(400);
    hideProgress('receipt');
    if (pageErrors.length) showError('receipt', pageErrors.join('\n'));
    renderReceiptTable();
    updateCostBadge('receipt');

  } catch (e) {
    hideProgress('receipt');
    showError('receipt', e.message);
  }
}

const RECEIPT_FLAG_LABELS = {

function renderReceiptRow(r, i, isWarn) {

    <td contenteditable="true" data-idx="${i}" data-field="invoice_class">${esc(r.invoice_class)}</td>
    ${extraCell}
  </tr>`;

function renderReceiptTable() {
  const tbody     = document.getElementById('receipt-tbody');
  const warnTbody = document.getElementById('receipt-warn-tbody');

  // フラグなし（正常行）とフラグあり（要確認行）に分割
  const okPairs   = [];
  const warnPairs = [];
  receiptData.forEach((r, i) => {
    if (r.flag) warnPairs.push({ r, i });
    else        okPairs.push({ r, i });
  });

  // 正常テーブル
  tbody.innerHTML = okPairs.map(({ r, i }) => renderReceiptRow(r, i, false)).join('');
  bindEditable(tbody, receiptData);
  document.getElementById('receipt-count').textContent = okPairs.length;

  // 要確認テーブル
  const warnSection = document.getElementById('receipt-warn-section');
  const warnCountEl = document.getElementById('receipt-warn-count');
  if (warnPairs.length > 0) {
    warnTbody.innerHTML = warnPairs.map(({ r, i }) => renderReceiptRow(r, i, true)).join('');
    bindEditable(warnTbody, receiptData);
    warnCountEl.textContent   = warnPairs.length;
    warnSection.style.display = 'block';
  } else {
    warnTbody.innerHTML       = '';
    warnSection.style.display = 'none';
  }

  document.getElementById('receipt-results').style.display = 'block';
}

function downloadCSVReceipt() {
  const BOM = '﻿';
  let csv = BOM + '日付,摘要,金額,軽減税率,請求書区分\n';
  receiptData.forEach(r => {
    csv += [r.date, r.description, r.amount ?? '', r.reduced_tax, r.invoice_class].map(csvField).join(',') + '\n';
  });
  downloadFile(csv, '領収書.csv');
}

const BANKBOOK_PROMPT = `あなたは会計書類OCRの専門家です。この通帳・銀行明細画像から全ての取引を正確に抽出してください。

必ず以下のJSON形式だけで返してください（説明文・コードブロック不要）:
{
  "items": [
    {
      "date": "YYYY/MM/DD",
      "withdrawal": 数値またはnull,
      "deposit": 数値またはnull,
      "description": "摘要",
      "balance": 数値またはnull
    }
  ]
}

【日付】
- 和暦→西暦変換: 令和8=2026、令和7=2025、令和6=2024、令和5=2023、令和4=2022、令和3=2021
- 月日のみの行は直前の行の年を引き継ぐ
- 【行番号に注意 — 最重要】この通帳では各行の左端に小さい行番号（上付き数字）が印刷されている。行番号は日付ではない
  - 日付形式は「YY-MM-DD」（和暦2桁-月2桁-日2桁）
  - 例: 「¹³08-01-13」→ 行番号=13、日付=08-01-13（令和8年1月13日=2026/01/13）← 月は「01」
  - 例: 「⁸08-01-08」→ 行番号=8、日付=08-01-08（令和8年1月8日=2026/01/08） ← 月は「01」
  - 行番号の最後の数字と和暦年の最初の数字が連続して見えても、必ず「YY-MM-DD」の3組に分割して読むこと
  - 「08-01-13」は「年=08、月=01、日=13」であり「年=08、月=08、日=13」ではない

【金額列の判定 — 絶対厳守】
通帳には「お支払金額（出金）」列と「お預り金額（入金）」列の2列がある。
- 出金(withdrawal): 「お支払金額」列の金額のみ
- 入金(deposit): 「お預り金額」列の金額のみ
- 判定基準は【列の物理的な位置のみ】。摘要の文言で絶対に判断しないこと
- 「払戻」という文字が摘要にあっても、お預り金額列にあれば入金、お支払金額列にあれば出金
- 「払戻」はお預り金額列（入金）に記載されることが多い。お支払金額列に「払戻」がある場合は列の読み間違いを疑って再確認すること
- 金額が10万円を超える「払戻」は特に列位置を慎重に確認すること
- 1行の中に「お支払金額」と「お預り金額」が同時に入ることはない。どちらか一方のみ

【同一日付の複数行 — 抜け漏れ厳禁】
- 同一日付に複数行ある場合、すべての行を漏れなく抽出すること
- 残高が記載されていない行も必ず抽出すること（残高はnullで出力）
- ページ内の行順を維持して抽出すること

【残高(balance)の判定 — 最重要】
- 差引残高列に印字された純粋な数値のみを残高とする
- 残高は通常6桁以上（数万〜数百万円台）
- 【絶対に残高と誤読してはいけない値】:
  ・英字を含むコード: R166, RT206, LT166, K206, K272, Q272, Q341, K454, R454 など（アルファベット+数字の組み合わせはすべて店番・端末コード）
  ・3〜4桁の小さな数字（コード番号の可能性が高い）
  ・残高列以外の列に印字された数値
- 残高が印字されていない行は必ず null にすること

【2段組レイアウトへの対応】
- 1つの取引が2行にわたる場合（例：1行目=日付・摘要・金額、2行目=残高・コード）は、2行を1つのitemとしてまとめる
- 2行目に残高が印字されている場合、その残高を直前の取引の balance に含める
- コード列（R166等）は description に含めず無視すること

【整合性チェック — 最重要】
- 残高が記載されている行について、前の残高がある場合は以下の式で検証すること:
  前残高 + 入金合計 - 出金合計 = 当行残高
- 上記が合わない場合は、その日付の取引を再確認し、入出金列の読み誤りや抽出漏れがないか修正して再抽出すること

【除外ルール】
- 入金・出金がともにない行（前月繰越・ページ繰越・残高のみ行・空白行）は含めない
- 数値はカンマなし整数値
- 全取引行を漏らさず抽出すること`;

let bankbookData = [];
let bankbookFileNames = [];

async function handleBankbookUpload(event) {
  const files = Array.from(event.target.files);
  event.target.value = '';
  if (!files.length) return;

  clearError('bankbook');
  bankbookData = [];
  bankbookFileNames = files.map(f => f.name);
  tabCost.bankbook = 0;
  resetAbort();
  startTimer('bankbook');

  try {
    const allImgs = [];
    for (const f of files) {
      showProgress('bankbook', `ファイル読み込み中: ${f.name}`, 5);
      const imgs = await fileToImages(f);
      allImgs.push(...imgs);
    }

    const total = allImgs.length;
    if (total === 0) throw new Error('画像を取得できませんでした');

    const pageErrors = [];
    for (let i = 0; i < total; i++) {
      const pct = Math.round(10 + ((i + 1) / total) * 85);
      showProgress('bankbook', `${i + 1} / ${total} ページ処理中...`, pct);

      if (abortFlag) break;
      try {
        const result = await callGemini(BANKBOOK_PROMPT, allImgs[i].data, allImgs[i].mime, 3, 'bankbook', 1024);
        for (const item of (result.items || [])) {
          const hasWd  = item.withdrawal != null;
          const hasDep = item.deposit    != null;
          const hasBal = item.balance    != null;
          // 入出金がない行（繰越行・空白行・残高のみ行）→ CSVに出力しない・残高も無視
          if (!hasWd && !hasDep) continue;
          bankbookData.push({
            date:        item.date        ?? '',
            withdrawal:  hasWd  ? item.withdrawal  : '',
            deposit:     hasDep ? item.deposit     : '',
            description: normalizeText(item.description),
            balance:     hasBal ? item.balance     : ''
          });
        }
      } catch (e) {
        if (e.message.includes('APIキー') || e.message.includes('レート制限') || e.message.includes('無効')) throw e;
        pageErrors.push(`ページ ${i + 1}: ${e.message}`);
      }

      if (i < total - 1) await sleep(REQUEST_DELAY);
    }

    // 日付昇順にソート（同日内はページ読み取り順を維持）
    bankbookData.sort((a, b) => {
      const da = a.date || '';
      const db = b.date || '';
      return da < db ? -1 : da > db ? 1 : 0;
    });

    const errCount  = runBalanceCheck();
    const dateGaps  = detectDateGaps(bankbookData, 30); // 30日以上の空白を検出

    showProgress('bankbook', abortFlag ? '中止しました' : '完了', 100);
    await sleep(400);
    hideProgress('bankbook');
    if (pageErrors.length) showError('bankbook', pageErrors.join('\n'));
    renderBankbookTable(errCount, dateGaps);
    updateCostBadge('bankbook');

  } catch (e) {
    hideProgress('bankbook');
    showError('bankbook', e.message);
  }
}

// 連続する取引の間に thresholdDays 日以上の空白があれば返す（最後の行以降は対象外）
function detectDateGaps(data, thresholdDays) {
  const gaps = [];
  const dated = data.filter(r => r.date && r.date.match(/^\d{4}\/\d{2}\/\d{2}$/));
  for (let i = 0; i < dated.length - 1; i++) {  // ← length-1 で最後の行以降は無視
    const d1 = new Date(dated[i].date);
    const d2 = new Date(dated[i + 1].date);
    const days = Math.round((d2 - d1) / 86400000);
    if (days >= thresholdDays) {
      gaps.push({ from: dated[i].date, to: dated[i + 1].date, days });
    }
  }
  return gaps;
}

function runBalanceCheck() {
  // 前回の自動補正をリセットして元の値に戻す
  bankbookData.forEach(r => {
    if (r.autofix) {
      r.deposit    = r.autofix.origDeposit;
      r.withdrawal = r.autofix.origWithdrawal;
    }
    r.check  = '';
    r.autofix = null;
  });

  let running       = null; // 直前の確定残高
  let baseBalance   = null; // 現区間の起点残高（自動補正の基準）
  let intervalStart = 0;    // 現区間の開始インデックス
  let errCount      = 0;

  for (let i = 0; i < bankbookData.length; i++) {
    const row = bankbookData[i];
    const dep = Math.round(parseFloat(row.deposit)    || 0);
    const wd  = Math.round(parseFloat(row.withdrawal) || 0);

    const balVal     = parseFloat(row.balance);
    const hasBalance = row.balance !== '' && row.balance != null &&
                       !isNaN(balVal) && balVal !== 0;

    if (!hasBalance) {
      if (running !== null) {
        running = running + dep - wd;
        if (running < 0) {          // マイナス残高は異常 → 次の残高行から再確立
          running = null; baseBalance = null; intervalStart = i + 1;
        }
      }
      continue;
    }

    const actual = Math.round(balVal);

    if (running === null) {
      // 基準値未確立 → 起点として設定
      running = actual; baseBalance = actual;
      bankbookData[i].check = 'OK';
      intervalStart = i + 1;
      continue;
    }

    const expected = running + dep - wd;

    if (expected < 0) {
      // 計算値がマイナス → 累積誤差とみなしリセット
      running = actual; baseBalance = actual;
      bankbookData[i].check = 'OK';
      intervalStart = i + 1;
      continue;
    }

    if (expected === actual) {
      bankbookData[i].check = 'OK';
      running = actual; baseBalance = actual;
      intervalStart = i + 1;
      continue;
    }

    // ── 不一致 → 入金/出金の反転パターンを全探索 ──────────────
    const idxs  = [];
    for (let j = intervalStart; j <= i; j++) idxs.push(j);
    const n     = idxs.length;
    const MAX_N = 16; // 最大 2^16 = 65,536 パターン
    let fixMask = -1;

    if (n <= MAX_N) {
      for (let mask = 1; mask < (1 << n) && fixMask === -1; mask++) {
        let t = baseBalance;
        for (let k = 0; k < n; k++) {
          const r2 = bankbookData[idxs[k]];
          const d2 = Math.round(parseFloat(r2.deposit)    || 0);
          const w2 = Math.round(parseFloat(r2.withdrawal) || 0);
          t += ((mask >> k) & 1) ? (w2 - d2) : (d2 - w2);
        }
        if (t === actual) fixMask = mask;
      }
    }

    if (fixMask !== -1) {
      // 補正パターン確定 → 該当行の入金/出金を入れ替えて「自動補正」マーク
      for (let k = 0; k < n; k++) {
        const r2 = bankbookData[idxs[k]];
        if ((fixMask >> k) & 1) {
          r2.autofix    = { origDeposit: r2.deposit, origWithdrawal: r2.withdrawal };
          r2.deposit    = r2.autofix.origWithdrawal;
          r2.withdrawal = r2.autofix.origDeposit;
          r2.check      = '自動補正';
        } else {
          r2.check = r2.check || 'OK';
        }
      }
    } else {
      // どのパターンでも合わない → 「要確認」
      const diff = actual - expected;
      bankbookData[i].check =
        `要確認（差額：${diff >= 0 ? '+' : ''}${diff.toLocaleString()}円）`;
      errCount++;
    }

    running = actual; baseBalance = actual;
    intervalStart = i + 1;
  }

  return errCount;
}

function renderBankbookTable(errCount = 0, dateGaps = []) {
  // ファイル名表示
  const infoEl = document.getElementById('bankbook-balance-info');
  const fileLabel = bankbookFileNames.length
    ? `<span style="color:#4a5568">📄 ${bankbookFileNames.map(esc).join('、')}</span>`
    : '';
  const autofixCount = bankbookData.filter(r => r.check === '自動補正').length;
  const hasBal       = bankbookData.some(r => r.balance !== '');
  let statusParts = [];
  if (hasBal) {
    if (errCount === 0 && autofixCount === 0)
      statusParts.push(`<span style="color:#059669;font-weight:700">✓ 残高一致</span>`);
    else {
      if (errCount > 0)
        statusParts.push(`<span style="color:#e53e3e;font-weight:700">⚠ 要確認 ${errCount}件</span>`);
      if (autofixCount > 0)
        statusParts.push(`<span style="color:#d97706;font-weight:700">✏ 自動補正 ${autofixCount}件</span>`);
    }
  }
  const balanceLabel = statusParts.join(' &nbsp; ');
  const gapHtml = dateGaps.length
    ? dateGaps.map(g =>
        `<div class="alert alert-warn" style="margin:6px 0;font-size:0.88rem">
          ⚠ データが抜けている可能性があります：${esc(g.from)} 〜 ${esc(g.to)}（約${g.days}日間の空白）
        </div>`
      ).join('')
    : '';
  infoEl.innerHTML =
    (fileLabel || balanceLabel
      ? `<div style="display:flex;gap:16px;align-items:center;padding:10px 0;font-size:0.9rem">${fileLabel}${balanceLabel}</div>`
      : '') + gapHtml;

  const tbody = document.getElementById('bankbook-tbody');
  tbody.innerHTML = bankbookData.map((r, i) => {
    const isConfirm = r.check && r.check.startsWith('要確認');
    const isAutofix = r.check === '自動補正';
    const rowClass  = isConfirm ? 'row-confirm' : isAutofix ? 'row-autofix' : '';

    const checkCell = r.check === 'OK'
      ? '<span class="check-ok">OK</span>'
      : isAutofix
        ? `<span class="check-fix" title="補正前 → 入金:${esc(String(r.autofix?.origDeposit||'－'))} ／ 出金:${esc(String(r.autofix?.origWithdrawal||'－'))}">✏ 自動補正</span>`
        : isConfirm
          ? `<span class="check-confirm">${esc(r.check)}</span>`
          : '';

    const wdAttr  = r.autofix ? ` title="補正前の出金: ${esc(String(r.autofix.origWithdrawal||'－'))}"` : '';
    const depAttr = r.autofix ? ` title="補正前の入金: ${esc(String(r.autofix.origDeposit||'－'))}"` : '';

    return `<tr class="${rowClass}">
      <td contenteditable="true" data-idx="${i}" data-field="date">${esc(r.date)}</td>
      <td contenteditable="true" data-idx="${i}" data-field="withdrawal"${wdAttr}>${esc(String(r.withdrawal))}</td>
      <td contenteditable="true" data-idx="${i}" data-field="deposit"${depAttr}>${esc(String(r.deposit))}</td>
      <td contenteditable="true" data-idx="${i}" data-field="balance">${esc(String(r.balance))}</td>
      <td contenteditable="true" data-idx="${i}" data-field="description">${esc(r.description)}</td>
      <td>${checkCell}</td>
      <td style="white-space:nowrap">
        <button class="btn-row-ins" onclick="insertBankbookRow(${i})" title="下に空行を挿入">＋</button>
        <button class="btn-row-del" onclick="deleteBankbookRow(${i})" title="この行を削除">✕</button>
      </td>
    </tr>`;
  }).join('');

  bindEditable(tbody, bankbookData);
  document.getElementById('bankbook-count').textContent = bankbookData.length;
  document.getElementById('bankbook-results').style.display = 'block';
}

function downloadCSVBankbook() {
  const BOM = '﻿';
  let csv = BOM + '日付,出金,入金,残高,摘要\n';
  bankbookData.forEach(r => {
    csv += [r.date, r.withdrawal, r.deposit, r.balance, r.description].map(csvField).join(',') + '\n';
  });
  downloadFile(csv, '通帳.csv');
}

// ═══════════════════════════════════════════════════════════
//  FEATURE ③  CARD STATEMENT
// ═══════════════════════════════════════════════════════════
const CARD_PROMPT = `あなたは会計書類OCRの専門家です。このカード明細の画像から全ての利用明細を抽出してください。

必ず以下のJSON形式だけで回答してください（説明文・コードブロック不要）:
{
  "items": [
    {
      "date": "YYYY/MM/DD",
      "amount": 数値,
      "description": "利用先・店名"
    }
  ],
  "total": 数値またはnull
}

抽出ルール:
- date: 和暦を西暦変換、月日のみなら文脈から年を補完
- amount: 利用金額（整数値、カンマなし）
- description: 利用先・店名・摘要
- total: ご請求合計・明細合計が記載されていれば数値、なければnull
- 全ての個別利用明細行を漏らさず抽出すること

【items に絶対に含めてはいけない行】
- 「今月ご利用額」「ご請求金額」「ご請求合計」「合計額」「小計」「合計」を含む行
- 氏名（〇〇様）と金額だけの行（例：「加藤 智之 様 今月ご利用額」）
- 「その他ご請求分」「繰越残高」「お支払金額」等の請求サマリ行
- ヘッダー行・説明行・注記行
これらは total フィールドにのみ反映すること

【摘要の簡略化ルール】
- ETCの場合：カード番号（ETC NO）・入口・出口・道路の重複情報を除き「ETC {道路会社名}」のみにすること（例：「ETC 首都高速道路」「ETC 東日本高速道路 関東支社」）`;

let cardData   = [];
let cardTotals = [];

async function handleCardUpload(event) {
  const files = Array.from(event.target.files);
  event.target.value = '';
  if (!files.length) return;

  clearError('card');
  cardData   = [];
  cardTotals = [];
  tabCost.card = 0;
  resetAbort();
  startTimer('card');

  try {
    const allImgs = [];
    for (const f of files) {
      showProgress('card', `ファイル読み込み中: ${f.name}`, 5);
      const imgs = await fileToImages(f);
      allImgs.push(...imgs);
    }

    const total = allImgs.length;
    if (total === 0) throw new Error('画像を取得できませんでした');

    const pageErrors = [];
    for (let i = 0; i < total; i++) {
      const pct = Math.round(10 + ((i + 1) / total) * 85);
      showProgress('card', `${i + 1} / ${total} ページ処理中...`, pct);

      if (abortFlag) break;
      try {
        const result = await callGemini(CARD_PROMPT, allImgs[i].data, allImgs[i].mime, 3, 'card');
        for (const item of (result.items || [])) {
          if (!item.date && item.amount == null) continue;
          // 合計・サマリ行を除外
          const d = item.description ?? '';
          if (/今月ご利用額|ご請求金額|ご請求合計|合計額|その他ご請求分|繰越残高|お支払金額/.test(d)) continue;
          if (/^.{1,10}様/.test(d)) continue; // 「〇〇様」で始まる行
          cardData.push({
            date:        item.date        ?? '',
            amount:      item.amount      != null ? item.amount : '',
            description: normalizeText(item.description)
          });
        }
        if (result.total != null) cardTotals.push(result.total);
      } catch (e) {
        if (e.message.includes('APIキー') || e.message.includes('レート制限') || e.message.includes('無効')) throw e;
        pageErrors.push(`ページ ${i + 1}: ${e.message}`);
      }

      if (i < total - 1) await sleep(REQUEST_DELAY);
    }

    showProgress('card', abortFlag ? '中止しました' : '完了', 100);
    await sleep(400);
    hideProgress('card');
    if (pageErrors.length) showError('card', pageErrors.join('\n'));
    renderCardTable();
    updateCostBadge('card');

  } catch (e) {
    hideProgress('card');
    showError('card', e.message);
  }
}

function renderCardTable() {
  const tbody = document.getElementById('card-tbody');
  tbody.innerHTML = cardData.map((r, i) => `
    <tr>
      <td contenteditable="true" data-idx="${i}" data-field="date">${esc(r.date)}</td>
      <td contenteditable="true" data-idx="${i}" data-field="amount">${esc(String(r.amount))}</td>
      <td contenteditable="true" data-idx="${i}" data-field="description">${esc(r.description)}</td>
    </tr>`).join('');

  bindEditable(tbody, cardData);

  // Summary check
  const sumEl = document.getElementById('card-summary');
  if (cardTotals.length > 0) {
    const extracted = cardData.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
    const reported  = cardTotals[cardTotals.length - 1];
    const diff      = Math.abs(extracted - reported);
    const match     = diff < 1;
    sumEl.innerHTML = `<div class="alert ${match ? 'alert-info' : 'alert-warn'}">
      明細合計: <strong>¥${extracted.toLocaleString()}</strong> ／ 請求合計: <strong>¥${reported.toLocaleString()}</strong>
      → ${match ? '<span style="color:#059669">✓ 一致</span>' : `<span style="color:#e53e3e">⚠ 差異 ¥${diff.toLocaleString()}</span>`}
    </div>`;
  } else {
    sumEl.innerHTML = '';
  }

  document.getElementById('card-count').textContent = cardData.length;
  document.getElementById('card-results').style.display = 'block';
}

function downloadCSVCard() {
  const BOM = '﻿';
  let csv = BOM + '日付,出金,摘要\n';
  cardData.forEach(r => {
    csv += [r.date, r.amount, r.description].map(csvField).join(',') + '\n';
  });
  downloadFile(csv, 'カード明細.csv');
}

// ─── Unified CSV dispatch ─────────────────────────────────
function downloadCSV(tab) {
  if (tab === 'receipt')  return downloadCSVReceipt();
  if (tab === 'bankbook') return downloadCSVBankbook();
  if (tab === 'card')     return downloadCSVCard();
}

function deleteBankbookRow(i) {
  bankbookData.splice(i, 1);
  const errCount = runBalanceCheck();
  const dateGaps = detectDateGaps(bankbookData, 30);
  renderBankbookTable(errCount, dateGaps);
}

function insertBankbookRow(i) {
  bankbookData.splice(i + 1, 0, {
    date: '', withdrawal: '', deposit: '', description: '', balance: '', check: '', autofix: null
  });
  const errCount = runBalanceCheck();
  const dateGaps = detectDateGaps(bankbookData, 30);
  renderBankbookTable(errCount, dateGaps);
}

function recheckBalance() {
  if (!bankbookData.length) return;
  const errCount = runBalanceCheck();
  const dateGaps = detectDateGaps(bankbookData, 30);
  renderBankbookTable(errCount, dateGaps);
}

// ─── Clear results ────────────────────────────────────────
function clearResults(tab) {
  clearError(tab);
  if (tab === 'receipt') {
    receiptData = [];
    document.getElementById('receipt-results').style.display = 'none';
  } else if (tab === 'bankbook') {
    bankbookData = [];
    document.getElementById('bankbook-results').style.display = 'none';
    document.getElementById('bankbook-balance-info').innerHTML = '';
    const rb = document.getElementById('btn-recheck');
    if (rb) rb.remove();
  } else if (tab === 'card') {
    cardData = []; cardTotals = [];
    document.getElementById('card-results').style.display = 'none';
    document.getElementById('card-summary').innerHTML = '';
  }
}
