<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会計OCRアプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; background: #f0f2f5; color: #333; font-size: 14px; }

    /* Header */
    .header { background: #1a2942; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; box-shadow: 0 2px 6px rgba(0,0,0,0.25); }
    .header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
    .api-key-group { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    .api-key-group label { font-size: 0.85rem; white-space: nowrap; color: #cdd5e0; }
    .api-key-group input { padding: 7px 10px; border: 1px solid #4a5568; border-radius: 5px; background: #2d3e55; color: #fff; width: 260px; font-size: 0.85rem; }
    .api-key-group input::placeholder { color: #8899aa; }
    .btn-save-key { padding: 7px 14px; background: #3b82f6; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; transition: background 0.15s; }
    .btn-save-key:hover { background: #2563eb; }

    /* Tabs */
    .tabs { background: #fff; border-bottom: 2px solid #e2e8f0; display: flex; padding: 0 20px; gap: 4px; }
    .tab-btn { padding: 12px 22px; border: none; background: none; cursor: pointer; font-size: 0.95rem; color: #718096; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color 0.15s; font-weight: 500; }
    .tab-btn:hover { color: #2d3748; }
    .tab-btn.active { color: #1a2942; border-bottom-color: #3b82f6; font-weight: 700; }

    /* Content */
    .content { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Upload Area */
    .upload-area { display: block; border: 2px dashed #cbd5e0; border-radius: 10px; padding: 44px 24px; text-align: center; background: #fff; cursor: pointer; transition: border-color 0.2s, background 0.2s; user-select: none; }
    .upload-area:hover, .upload-area.dragover { border-color: #3b82f6; background: #eff6ff; }
    .upload-icon { font-size: 3rem; margin-bottom: 12px; display: block; }
    .upload-area p { color: #718096; margin: 4px 0; line-height: 1.6; }
    .upload-area strong { color: #2d3748; }
    .upload-area input[type=file] { display: none; }
    .btn-select-file { display: inline-block; margin-top: 14px; padding: 9px 22px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: background 0.15s; }
    .btn-select-file:hover { background: #2563eb; }

    /* Progress */
    .progress-area { background: #fff; border-radius: 8px; padding: 18px 20px; margin: 14px 0; display: none; border: 1px solid #e2e8f0; }
    .progress-text { font-size: 0.9rem; color: #4a5568; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .progress-bar-wrap { background: #e2e8f0; border-radius: 99px; height: 7px; overflow: hidden; }
    .progress-bar { background: #3b82f6; height: 7px; border-radius: 99px; transition: width 0.35s ease; width: 0%; }
    .progress-remaining { font-size: 0.85rem; color: #718096; margin-top: 6px; min-height: 1.2em; }

    /* Results */
    .results-area { background: #fff; border-radius: 10px; padding: 20px; margin: 14px 0; display: none; border: 1px solid #e2e8f0; }
    .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .results-header h3 { font-size: 1rem; color: #2d3748; }
    .btn-download { padding: 8px 18px; background: #059669; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: background 0.15s; }
    .btn-download:hover { background: #047857; }
    .btn-clear { padding: 6px 14px; background: #e53e3e; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 0.85rem; transition: background 0.15s; }
    .btn-clear:hover { background: #c53030; }
    .action-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }

    /* Table */
    .table-wrap { overflow-x: auto; border-radius: 6px; border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    thead th { background: #f7fafc; padding: 9px 12px; text-align: left; border-bottom: 2px solid #e2e8f0; font-weight: 700; white-space: nowrap; color: #4a5568; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; }
    tbody td { padding: 7px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafbfc; }
    td[contenteditable=true] { outline: none; cursor: text; }
    td[contenteditable=true]:focus { background: #fffbeb; box-shadow: inset 0 0 0 2px #f59e0b; }
    tr.row-error { background: #fff5f5 !important; }
    tr.row-error td { color: #c53030; }
    tr.row-review { background: #fff0f0 !important; }
    tr.row-review td { color: #c53030; }
    tr.row-duplicate { background: #fffde7 !important; }
    .check-ok { color: #059669; font-weight: 700; }
    .check-ng { color: #e53e3e; font-weight: 700; }
    .check-fixed { color: #38a169; font-weight: 700; font-size: 0.82rem; }
    tr.row-autofixed { background: #f0fff4 !important; }
    .btn-del-row { padding: 2px 8px; background: #fc8181; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.78rem; }
    .btn-del-row:hover { background: #f56565; }
    .btn-ins-row { padding: 2px 8px; background: #90cdf4; color: #2d3748; border: none; border-radius: 4px; cursor: pointer; font-size: 0.78rem; margin-left: 3px; }
    .btn-ins-row:hover { background: #63b3ed; }
    .btn-undo-row { padding: 5px 12px; background: #ed8936; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 0.85rem; display: none; }
    .btn-undo-row:hover { background: #dd6b20; }
    .flag-review { font-size: 0.75rem; background: #e53e3e; color: #fff; border-radius: 3px; padding: 1px 5px; margin-right: 4px; }
    .flag-dup { font-size: 0.75rem; background: #d69e2e; color: #fff; border-radius: 3px; padding: 1px 5px; margin-right: 4px; }

    /* Alerts */
    .alert { padding: 11px 16px; border-radius: 7px; margin: 10px 0; font-size: 0.9rem; line-height: 1.5; }
    .alert-error { background: #fff5f5; color: #c53030; border: 1px solid #fed7d7; }
    .alert-info { background: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; }
    .alert-warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }

    /* Spinner */
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2.5px solid #cbd5e0; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.75s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Abort button */
    .btn-abort { padding: 5px 12px; background: #e53e3e; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 0.82rem; font-weight: 700; white-space: nowrap; }
    .btn-abort:hover { background: #c53030; }
    /* Cost badge */
    .cost-badge { font-size: 0.82rem; color: #718096; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 5px; padding: 3px 10px; }
    /* Misc */
    .tip { font-size: 0.82rem; color: #a0aec0; margin-top: 4px; }
    .count-badge { background: #3b82f6; color: #fff; border-radius: 99px; padding: 2px 8px; font-size: 0.78rem; font-weight: 700; margin-left: 6px; }
  </style>
</head>
<body>

<!-- ===== SCRIPTS ===== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';

// ─── Config ───────────────────────────────────────────────
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const GEMINI_MODEL    = 'gemini-2.5-flash';
const GEMINI_ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
const CONCURRENCY     = 10;
// Gemini 2.5 Flash 料金 (USD/1M tokens) ※ Standard Tier
// 参照: https://ai.google.dev/gemini-api/docs/pricing
const PRICE_INPUT  = 0.30;  // テキスト・画像・動画
const PRICE_OUTPUT = 1.00;  // 出力（Thinking無効時）
const JPY_RATE     = 150;   // 円換算レート（概算）

let abortFlag = false;
let tabCost   = { receipt: 0, bankbook: 0, card: 0 }; // USD

function abortProcessing() {
  abortFlag = true;
}

function resetAbort() {
  abortFlag = false;
}

// 並列実行ヘルパー（結果は元の順序を保持）
async function runWithConcurrency(tasks, limit) {
  const results = new Array(tasks.length);
  let nextIdx = 0;
  async function worker() {
    while (nextIdx < tasks.length) {
      const i = nextIdx++;
      results[i] = await tasks[i]();
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
  return results;
}

function addCost(tab, inputTokens, outputTokens) {
  tabCost[tab] += (inputTokens * PRICE_INPUT + outputTokens * PRICE_OUTPUT) / 1_000_000;
}

function formatCost(usd) {
  const jpy = Math.round(usd * JPY_RATE);
  if (usd < 0.001) return '< $0.001 (< ¥1)';
  return `$${usd.toFixed(4)} (約¥${jpy})`;
}

function updateCostBadge(tab) {
  const el = document.getElementById(tab + '-cost');
  if (el) el.innerHTML = `API利用料: ${formatCost(tabCost[tab])} <a href="https://ai.google.dev/gemini-api/docs/pricing" target="_blank" style="color:#3b82f6;font-size:0.78rem">料金表</a>`;
}

// ─── Startup ──────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('gemini_api_key');
  if (saved) document.getElementById('apiKeyInput').value = saved;

  setupDrop('receipt-drop',  'receipt-file',  handleReceiptUpload);
  setupDrop('bankbook-drop', 'bankbook-file', handleBankbookUpload);
  setupDrop('card-drop',     'card-file',     handleCardUpload);
});

function saveApiKey() {
  const k = document.getElementById('apiKeyInput').value.trim();
  if (!k) { alert('APIキーを入力してください'); return; }
  localStorage.setItem('gemini_api_key', k);
  const btn = document.querySelector('.btn-save-key');
  const orig = btn.textContent;
  btn.textContent = '✓ 保存済';
  setTimeout(() => btn.textContent = orig, 1500);
}

function getApiKey() {
  return localStorage.getItem('gemini_api_key') ||
         document.getElementById('apiKeyInput').value.trim();
}

// ─── Tab switching ────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

// ─── Drag & Drop ─────────────────────────────────────────
function setupDrop(dropId, fileId, handler) {
  const zone = document.getElementById(dropId);
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('dragover'); });
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handler({ target: { files: e.dataTransfer.files } });
  });
}

// ─── PDF → base64 images ─────────────────────────────────
function isBlankCanvas(canvas, threshold = 253) {
  const ctx  = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const step = Math.max(1, Math.floor(Math.sqrt(w * h / 8000)));
  const data = ctx.getImageData(0, 0, w, h).data;
  let sum = 0, count = 0;
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      const idx = (y * w + x) * 4;
      sum += (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
      count++;
    }
  }
  return count > 0 && (sum / count) >= threshold;
}

async function pdfToImages(file, scale = 2.0) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const results = await Promise.all(Array.from({ length: pdf.numPages }, async (_, i) => {
    const page     = await pdf.getPage(i + 1);
    const viewport = page.getViewport({ scale });
    const canvas   = document.createElement('canvas');
    canvas.width   = viewport.width;
    canvas.height  = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    return canvas.toDataURL('image/jpeg', 0.88).split(',')[1];
  }));
  return results.filter(d => d !== null);
}

async function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function fileMime(file) {
  if (file.type) return file.type;
  const ext = file.name.toLowerCase().split('.').pop();
  return ({ jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png',
            gif: 'image/gif', webp: 'image/webp', pdf: 'application/pdf' })[ext] || 'image/jpeg';
}

async function fileToImages(file) {
  const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  if (isPdf) {
    const imgs = await pdfToImages(file);
    return imgs.map(d => ({ data: d, mime: 'image/jpeg' }));
  }
  const data = await fileToBase64(file);
  return [{ data, mime: fileMime(file) }];
}

// ─── Gemini API ───────────────────────────────────────────
async function callGemini(prompt, imageData, imageMime, retries = 2, tab = null) {
  const key = getApiKey();
  if (!key) throw new Error('Gemini APIキーが未設定です。ヘッダーのAPIキー欄に入力して「保存」してください。');

  const body = {
    contents: [{ parts: [
      { text: prompt },
      { inline_data: { mime_type: imageMime, data: imageData } }
    ]}],
    generationConfig: { temperature: 0.1, thinkingConfig: { thinkingBudget: 0 } }
  };

  let consecutive429 = 0;
  for (let attempt = 0; attempt <= retries; attempt++) {
    const res = await fetch(`${GEMINI_ENDPOINT}?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const msg = err.error?.message || `HTTP ${res.status}`;
      if (res.status === 401 || res.status === 403) throw new Error(`APIキーが無効または権限がありません: ${msg}`);
      const isRetryable = res.status === 429 || res.status === 503 || msg.includes('high demand') || msg.includes('overloaded');
      if (isRetryable && attempt < retries) {
        if (res.status === 429) {
          consecutive429++;
          if (consecutive429 >= 3) {
            const msgEl = tab ? document.getElementById(tab + '-progress-msg') : null;
            for (let s = 2; s > 0; s--) {
              if (msgEl) msgEl.textContent = `レート制限 リトライ待機... ${s}秒`;
              await sleep(500);
              if (msgEl) msgEl.textContent = `レート制限 リトライ待機... ${s - 0.5}秒`;
              await sleep(500);
            }
            consecutive429 = 0;
          }
        } else {
          consecutive429 = 0;
        }
        continue;
      }
      throw new Error(`Gemini APIエラー: ${msg}`);
    }
    consecutive429 = 0;

    const data = await res.json();

    // トークン集計（Thinking トークンも出力に含める）
    const usage = data.usageMetadata;
    if (usage && tab) {
      const outTokens = (usage.candidatesTokenCount || 0) + (usage.thoughtsTokenCount || 0);
      addCost(tab, usage.promptTokenCount || 0, outTokens);
      updateCostBadge(tab);
    }

    // Safety block check
    const finishReason = data.candidates?.[0]?.finishReason;
    if (finishReason && finishReason !== 'STOP' && finishReason !== 'MAX_TOKENS') {
      throw new Error(`Geminiが応答をブロックしました (${finishReason})`);
    }

    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    if (!text) throw new Error('Geminiから空の応答が返されました');

    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error(`JSONが見つかりません。応答: ${text.slice(0, 100)}`);
    try {
      return JSON.parse(jsonMatch[0]);
    } catch (e) {
      throw new Error(`JSON解析失敗: ${e.message} / 応答: ${text.slice(0, 100)}`);
    }
  }
}

  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

  tbody.querySelectorAll('td[contenteditable=true]').forEach(td => {

      const field = td.dataset.field;

function csvField(v) {
  const s = String(v ?? '');
  return (s.includes(',') || s.includes('"') || s.includes('\n'))
    ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadFile(content, filename) {
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

const RECEIPT_PROMPT = `以下のレシート・領収書画像から情報を抽出し、JSON形式のみで返してください。

{
  "date": "日付 YYYY/MM/DD形式。以下のルールで変換する。①和暦（令和N年=2018+N年。例：令和7=2025、令和8=2026、令和6=2024、令和5=2023、令和4=2022、令和3=2021、令和2=2020、令和1=2019、平成N年=1988+N年）②令和をRまたは数字2桁で略記した形式（例：07-11-12→令和7年→2025/11/12、08-11-12→令和8年→2026/11/12、R7.11.12→2025/11/12、R8.11.12→2026/11/12）③西暦下2桁表記（例：25年09月30日→2025/09/30、26年01月01日→2026/01/01）④読み取れない場合はnull",
  "store_name": "店名（判読不能は「（手書き 店名不明）」）",

  "renban": "一連No.数字のみ、なければnull",
  "invoice_number": "適格請求書発行事業者の登録番号。「登録番号」「登録No」「インボイス番号」等のラベルの後に続くT+13桁の数字を抽出。例：「登録番号：T1013301024541」→「T1013301024541」。画像内にTで始まる13桁の数字が少しでも読み取れる場合は必ず抽出すること。なければnull",
  "is_nontax": "非課税取引（医療費・郵便切手・収入印紙・土地等）の場合はtrue、それ以外はfalse",
  "tax_ambiguous": "課税区分の判断根拠が不明確な場合はtrue、明確に判断できる場合はfalse",
  "amount_10": "10%対象税込金額 数値のみ、なければnull",
  "amount_8": "8%対象税込金額 数値のみ、なければnull",
  "amount_total": "合計税込金額 数値のみ"
}

注意：
- 金額はカンマなし数値のみ
- 税率区別が明示されていない場合はamount_totalのみ、amount_10/8はnull
- レシート以外のページはすべてnullで返す`;

let receiptData = [];
let receiptFileNames = [];

function receiptToRows(result) {
  if (result.date == null && result.amount_total == null &&
      result.amount_10 == null && result.amount_8 == null) return null;

  const store        = result.store_name ?? '';
  const purpose      = result.purpose ? result.purpose.trim() : null;
  const renban       = result.renban != null ? String(result.renban) : null;
  const invoiceClass = result.invoice_number ? '' : '区分記載';
  const isMixed      = result.amount_10 != null && result.amount_8 != null;
  const isNontax     = !!result.is_nontax;
  const isAmbiguous  = !!result.tax_ambiguous;
  const has8only     = result.amount_8 != null && result.amount_10 == null && !isMixed;
  const date         = result.date ?? '';

  // 日付バリデーション（空欄 or 5年超前 or 未来）
  let needsReview = !date;
  if (date && !needsReview) {
    const d = new Date(date);
    const now = new Date();
    const limit = new Date(); limit.setFullYear(now.getFullYear() - 5);
    if (isNaN(d.getTime()) || d > now || d < limit) needsReview = true;
  }

  function desc(taxLabel) {
    let s = store;
    if (purpose) s += ` ${purpose}`;
    if (isMixed) {
      s += ` ${taxLabel}分`;
      if (renban) s += ` 一連${renban}`;
    }
    if (isNontax)           s += '（非課税）';
    else if (has8only || taxLabel === '8%') s += '（軽減8%）';
    else if (isAmbiguous)   s += '（課税区分不明）';
    return s;
  }

  const base = { needsReview, isDuplicate: false, storeKey: store };
  if (isMixed) {
    return [
      { ...base, date, description: desc('10%'), amount: result.amount_10, reduced_tax: '',  invoice_class: invoiceClass },
      { ...base, date, description: desc('8%'),  amount: result.amount_8,  reduced_tax: '※', invoice_class: invoiceClass }
    ];
  }
  return [
    { ...base, date, description: desc(''), amount: result.amount_total, reduced_tax: has8only ? '※' : '', invoice_class: invoiceClass }
  ];
}

async function handleReceiptUpload(event) {
  const files = Array.from(event.target.files);
  event.target.value = '';
  if (!files.length) return;

  clearError('receipt');
  receiptData = [];
  receiptFileNames = files.map(f => f.name);
  tabCost.receipt = 0;
  resetAbort();

  try {
    const allImgs = [];
    for (const f of files) {
      showProgress('receipt', `ファイル読み込み中: ${f.name}`, 5);
      const imgs = await fileToImages(f);
      allImgs.push(...imgs);
    }

    const total = allImgs.length;
    if (total === 0) throw new Error('画像を取得できませんでした');

    const pageErrors = [];
    const startTime = Date.now();
    let completed = 0;

    const pageResults = await runWithConcurrency(allImgs.map((img, i) => async () => {
      if (abortFlag) return null;
      try {
        const result = await callGemini(RECEIPT_PROMPT, img.data, img.mime, 2, 'receipt');
        return { result, page: i + 1 };
      } catch (e) {
        if (e.message.includes('APIキー') || e.message.includes('レート制限') || e.message.includes('無効')) throw e;
        pageErrors.push(`ページ ${i + 1} 要確認（2回失敗しスキップ）: ${e.message}`);
        return null;
      } finally {
        completed++;
        const elapsed = Math.round((Date.now() - startTime) / 1000);
        showProgress('receipt', `${completed} / ${total} ページ処理中... 経過${elapsed}秒`, Math.round(10 + completed / total * 85));
      }
    }), CONCURRENCY);

    // 順序を保ったまま両面重複除外→データ収集
    let lastKey = null;
    for (const item of pageResults) {
      if (!item) continue;
      const { result, page } = item;
      const rows = receiptToRows(result);
      if (!rows) continue;
      const key = `${result.date}_${result.store_name}_${result.amount_total ?? result.amount_10}`;
      if (key === lastKey) continue;
      lastKey = key;
      rows.forEach(r => r.page = page);
      receiptData.push(...rows);
    }

    showProgress('receipt', abortFlag ? '中止しました' : '完了', 100);
    await sleep(400);
    hideProgress('receipt');
    if (pageErrors.length) showError('receipt', pageErrors.join('\n'));
    renderReceiptTable();
    renderFilename('receipt', receiptFileNames);
    updateCostBadge('receipt');

  } catch (e) {
    hideProgress('receipt');
    showError('receipt', e.message);
  }
}

function renderReceiptTable() {
  const tbody = document.getElementById('receipt-tbody');
  tbody.innerHTML = receiptData.map((r, i) => {
    const rowClass = r.needsReview ? 'row-review' : '';
    const dateCell = r.needsReview
      ? `<span class="flag-review">要確認</span>${esc(r.date)}`
      : esc(r.date);
    return `
    <tr class="${rowClass}">
      <td style="color:#a0aec0;font-size:0.8rem;white-space:nowrap">P.${r.page ?? ''}</td>
      <td contenteditable="true" data-idx="${i}" data-field="date">${dateCell}</td>
      <td contenteditable="true" data-idx="${i}" data-field="description">${esc(r.description)}</td>
      <td contenteditable="true" data-idx="${i}" data-field="amount">${esc(String(r.amount ?? ''))}</td>
      <td contenteditable="true" data-idx="${i}" data-field="income">${esc(String(r.income ?? ''))}</td>
      <td contenteditable="true" data-idx="${i}" data-field="reduced_tax">${esc(r.reduced_tax)}</td>
      <td style="white-space:nowrap"><button class="btn-del-row" onclick="deleteReceiptRow(${i})">削除</button><button class="btn-ins-row" onclick="insertReceiptRow(${i})">挿入</button></td>
    </tr>`;
  }).join('');

  bindEditable(tbody, receiptData);
  document.getElementById('receipt-count').textContent = receiptData.length;
  document.getElementById('receipt-results').style.display = receiptData.length ? 'block' : 'none';
}

// ─── Undo stack ───────────────────────────────────────────
const undoStack = { receipt: [], bankbook: [], card: [] };

function pushUndo(tab, action) {
  undoStack[tab].push(action);
  const btn = document.getElementById(tab + '-undo');
  if (btn) btn.style.display = 'inline';
}

function updateUndoBtn(tab) {
  const btn = document.getElementById(tab + '-undo');
  if (btn) btn.style.display = undoStack[tab].length ? 'inline' : 'none';
}

function undoAction(tab) {
  const action = undoStack[tab].pop();
  if (!action) return;
  if (tab === 'receipt') {
    if (action.type === 'delete') receiptData.splice(action.index, 0, action.row);
    else receiptData.splice(action.index, 1);
    renderReceiptTable();
  } else if (tab === 'bankbook') {
    if (action.type === 'delete') bankbookData.splice(action.index, 0, action.row);
    else bankbookData.splice(action.index, 1);
    const errCount = runBalanceCheck();
    renderBankbookTable(errCount);
  } else if (tab === 'card') {
    if (action.type === 'delete') cardData.splice(action.index, 0, action.row);
    else cardData.splice(action.index, 1);
    renderCardTable();
  }
  updateUndoBtn(tab);
}

function deleteReceiptRow(i) {
  pushUndo('receipt', { type: 'delete', index: i, row: Object.assign({}, receiptData[i]) });
  receiptData.splice(i, 1);
  renderReceiptTable();
}

function insertReceiptRow(i) {
  const newRow = { date: '', description: '', amount: '', income: '', reduced_tax: '', page: '-', needsReview: false, isDuplicate: false };
  receiptData.splice(i + 1, 0, newRow);
  pushUndo('receipt', { type: 'insert', index: i + 1 });
  renderReceiptTable();
}

function downloadCSVReceipt() {
  const BOM = '﻿';
  let csv = BOM + 'ページ,日付,摘要,出金,入金,軽減税率\n';
  receiptData.forEach(r => {
    const csvDate = r.needsReview ? '' : r.date;
    csv += [r.page ?? '', csvDate, r.description, r.amount ?? '', r.income ?? '', r.reduced_tax].map(csvField).join(',') + '\n';
  });
  downloadFile(csv, toCsvFilename(receiptFileNames, '領収書.csv'));
}

### 入出金の判断ルール（最重要）
- **必ず列の物理的な位置で判断すること**
- 「お支払金額」「出金」「引落」列に記載された金額 → withdrawal（出金）
- 「お預り金額」「入金」「預入」列に記載された金額 → deposit（入金）
- 摘要の文言（「払戻」「振込」「為替」「払込」等）で入出金を判断しないこと
- 「払戻」「払込」は出金列に記載されることもあるため、列位置のみで判断する
- 「為替手数料」「振込手数料」は通常出金列の小額取引。入金列に記載がない限り出金とする
- アスタリスク(*)は列内の区切り文字。「*441,383」のように出金列にある場合は withdrawal: 441383 とする。残高列の「*519,399*」とは別物
- 出金列・入金列・残高列の物理的な左右位置を最優先し、金額の前後の*の有無で列を判断しないこと

### 日付のルール
- 通帳の日付形式を YYYY/MM/DD に変換する
- 年度の変換ルール（最優先・この通帳専用の設定）：
  - この通帳の「${ryStr}」は令和${ry}年 = ${baseYear}年を意味します
  - 「${ryStr}-」で始まる日付 → ${baseYear}年（例：${ryStr}-12-25 → ${baseYear}/12/25）
  - 「${ryStr1}-」で始まる日付 → ${baseYear + 1}年（例：${ryStr1}-1-5 → ${baseYear + 1}/01/05）
  - 「${wyStr}--」で始まる日付 → ${baseYear}年（例：${wyStr}--1-27 → ${baseYear}/01/27）
  - 「${wyStr1}--」で始まる日付 → ${baseYear + 1}年（例：${wyStr1}--1-5 → ${baseYear + 1}/01/05）
- ページ上部に年度が記載されている場合はそれを使用する
- 令和N年の一般変換：令和N年 = 2018+N年（例：R7=2025、R8=2026）。日付列の先頭2桁が令和年号のNN-MM-DD形式も同様（例：01-10-02→2019/10/02、05-12-11→2023/12/11、07-05-09→2025/05/09）
- RまたはRで始まる略記（例：R7.11.12→2025/11/12、R8.3.5→2026/03/05）
- 西暦下2桁表記（例：25.9.30→2025/09/30、26.1.1→2026/01/01）
- 日付が空欄の行（前行の取引の続き行）は前行と同じ日付を使用する

### 残高のルール
- 差引残高列が空欄の行は balance: null とする
- 「RT206」「R7」「LT166」「K 206」等の記号・店番号欄の値を残高と誤読しないこと
- 「5ネンドシモキ」等の利払期表記は残高ではない。無視すること
- アスタリスク(*)は区切り文字。例：「*1,000,000******1,010,000」→ balance: 1010000
- 残高のマスキング部分(*****)は読み取り不要。前後の数値のみ抽出する

### スキップすべき行
- 日付・入金・出金・残高がすべて空欄の物理的空白行
- 「繰越」「前月繰越」「前ページ繰越」「通帳内のすべてのお取引を繰越しました」の行
- 残高のみで入出金が空欄の繰越行
- ページ下部の注意書き・説明文

### 複数行にまたがる取引
- 1取引が2行にまたがる場合（1行目：摘要+金額、2行目：振込先名等）は1つのitemとして結合する
- 振込先名（「--------ヨウ」等のダッシュ区切り）は前行の摘要に結合する
- 「シンワデコウヘ オクリコシヲ オネガイシマス」等の補足行は独立したitemにしない

### 金額の読み取り精度
- 類似数字の誤読に注意：7と1、8と0、6と0、3と8、5と6
- カンマ区切りの数値（1,000,000等）は正確に読み取る
- 前後の残高との整合性を確認してから出力する
- 存在しない取引を追加しないこと。画像に印字されている行のみ抽出する

### 利息・決算利息の行
- 「決算利息」「利息」「利子」の行は金額が1円〜数百円と極小でも必ず抽出する
- 東京東信用金庫等で見られる「*3*******2,010,003」形式：入出金額が*と*に挟まれた数字、残高が末尾の数値

### 摘要フィールドのルール
- 摘要はお取引内容列のテキストのみを抽出する
- 通帳右端の店番号・記号欄（「RT272」「Q 537」「R 271」「LT166」「K 454」「RT206」等）は摘要ではない。descriptionに含めないこと
- 摘要が空欄の行は description: "" とする`;}

    }

    const total = allImgs.length;
    if (total === 0) throw new Error('画像を取得できませんでした');

    const baseYear   = parseInt(document.getElementById('bankbook-base-year').value) || 2025;
    const prompt     = getBankbookPrompt(baseYear);
    const pageErrors = [];
    const zeroPages  = [];
    const startTime  = Date.now();
    let completed    = 0;

    const pageResults = await runWithConcurrency(allImgs.map((img, i) => async () => {
      if (abortFlag) return null;
      let result = null;
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          result = await callGemini(prompt, img.data, img.mime, 2, 'bankbook');
          if ((result.items || []).length > 0) break;
          // 0件なら再試行
          const msgEl = document.getElementById('bankbook-progress-msg');
          if (msgEl && attempt < 2) msgEl.textContent = `ページ ${i + 1} 結果0件 再試行中 (${attempt + 2}/3)...`;
        } catch (e) {
          if (e.message.includes('APIキー') || e.message.includes('レート制限') || e.message.includes('無効')) throw e;
          if (attempt === 2) pageErrors.push(`ページ ${i + 1} 要確認（3回失敗しスキップ）: ${e.message}`);
          result = null;
        }
      }
      if (!result || (result.items || []).length === 0) zeroPages.push(i + 1);
      completed++;
      const elapsed = Math.round((Date.now() - startTime) / 1000);
      showProgress('bankbook', `${completed} / ${total} ページ処理中... 経過${elapsed}秒`, Math.round(10 + completed / total * 85));
      return result ? { result, page: i + 1 } : null;
    }), CONCURRENCY);

    const CARRYOVER_RE = /前[月ページ頁]?繰越|繰越残高|^繰越$/;
    for (const pageItem of pageResults) {
      if (!pageItem) continue;
      const { result, page } = pageItem;
      for (const item of (result.items || [])) {
        const hasWd  = item.withdrawal != null;
        const hasDep = item.deposit    != null;
        const hasBal = item.balance    != null;
        if (!hasWd && !hasDep) continue;
        // 繰越行をOCRが誤って入出金ありで返した場合も除外
        const desc = item.description ?? '';
        if (CARRYOVER_RE.test(desc)) continue;
        bankbookData.push({
          page,
          date:        item.date        ?? '',
          withdrawal:  hasWd  ? item.withdrawal  : '',
          deposit:     hasDep ? item.deposit     : '',
          description: desc,
          balance:     hasBal ? item.balance     : ''
        });
      }
    }

    const errCount = runBalanceCheck();

    showProgress('bankbook', abortFlag ? '中止しました' : '完了', 100);
    await sleep(400);
    hideProgress('bankbook');

    // 警告メッセージ収集
    const warns = [...pageErrors];
    if (zeroPages.length) warns.push(`抽出件数0件のページ: ${zeroPages.join(', ')}`);
    const gapWarns = checkDateGaps(bankbookData);
    warns.push(...gapWarns);
    if (warns.length) showError('bankbook', warns.join('\n'));

    renderBankbookTable(errCount);
    updateCostBadge('bankbook');

  } catch (e) {
    hideProgress('bankbook');
    showError('bankbook', e.message);
  }
}

function checkDateGaps(data) {
  const warns = [];
  const dates = data
    .map(r => r.date ? new Date(r.date) : null)
    .filter(d => d && !isNaN(d.getTime()))
    .sort((a, b) => a - b);
  for (let i = 1; i < dates.length; i++) {
    const gapDays = (dates[i] - dates[i - 1]) / 86400000;
    if (gapDays > 30) {
      const fmt = d => `${d.getFullYear()}年${d.getMonth() + 1}月`;
      warns.push(`${fmt(dates[i - 1])}〜${fmt(dates[i])}のデータが欠落している可能性があります（約${Math.round(gapDays)}日の空白）`);
    }
  }
  return warns;
}

function runBalanceCheck() {
  bankbookData.forEach(r => { r.check = ''; r.autoFixed = false; });

  let running              = null;
  let intervalStart        = 0;
  let intervalStartBalance = null;
  let errCount             = 0;

  for (let i = 0; i < bankbookData.length; i++) {
    const row = bankbookData[i];
    const dep = Math.round(parseFloat(row.deposit)    || 0);
    const wd  = Math.round(parseFloat(row.withdrawal) || 0);

    if (running !== null) running = running + dep - wd;

    if (row.balance === '' || row.balance == null) continue;

    const actual = Math.round(parseFloat(row.balance));

    if (running === null) {
      running              = actual;
      intervalStartBalance = actual;
      intervalStart        = i + 1;
      continue;
    }

    if (running === actual) {
      for (let j = intervalStart; j <= i; j++) bankbookData[j].check = 'OK';
    } else {
      // 1行スワップで修正できるか試みる
      const diff = actual - running;
      let fixedIdx = -1;

      for (let j = intervalStart; j <= i; j++) {
        const r = bankbookData[j];
        const w = Math.round(parseFloat(r.withdrawal) || 0);
        const d = Math.round(parseFloat(r.deposit)    || 0);

        if (w > 0 && d === 0 && 2 * w === diff) {
          r.deposit = w; r.withdrawal = ''; r.autoFixed = true;
          fixedIdx = j; break;
        }
        if (d > 0 && w === 0 && -2 * d === diff) {
          r.withdrawal = d; r.deposit = ''; r.autoFixed = true;
          fixedIdx = j; break;
        }
      }

      if (fixedIdx >= 0) {
        // 修正後に再計算して確認
        let recalc = intervalStartBalance;
        for (let j = intervalStart; j <= i; j++) {
          recalc += Math.round(parseFloat(bankbookData[j].deposit)    || 0)
                  - Math.round(parseFloat(bankbookData[j].withdrawal) || 0);
        }
        for (let j = intervalStart; j <= i; j++) bankbookData[j].check = 'OK';
      } else {
        const label = `残高不一致（計算値：${running.toLocaleString()}円、通帳値：${actual.toLocaleString()}円）`;
        for (let j = intervalStart; j <= i; j++) bankbookData[j].check = label;
        bankbookData[i].calculatedBalance = running;
        errCount++;
      }
    }

    running              = actual;
    intervalStartBalance = actual;
    intervalStart        = i + 1;
  }

  return errCount;
}

function renderBankbookTable(errCount = 0) {
  renderFilename('bankbook', bankbookFileNames);
  const noteEl = document.getElementById('bankbook-note');
  if (noteEl) {
    noteEl.innerHTML = errCount > 0
      ? `<div style="font-size:0.82rem;color:#4a5568;padding:4px 2px;line-height:1.8">
          残高不一致のボタン説明：
          <span style="background:#38a169;color:#fff;border-radius:3px;padding:1px 6px;margin:0 4px">✓ 計算値が正しい</span>計算値で残高を上書きしOKにする　／
          <span style="background:#718096;color:#fff;border-radius:3px;padding:1px 6px;margin:0 4px">✕ 解除</span>エラー表示を非表示にする（計算値には戻らない）　／
          <span style="background:#e2e8f0;color:#4a5568;border-radius:3px;padding:1px 6px;margin:0 4px">↩ 元に戻す</span>解除を取り消す
        </div>`
      : '';
  }
  const infoEl = document.getElementById('bankbook-balance-info');
  const balanceLabel = bankbookData.some(r => r.balance !== '')
    ? (errCount === 0
        ? `<span style="color:#059669;font-weight:700">✓ 残高一致</span>`
        : `<span style="color:#e53e3e;font-weight:700">⚠ 残高不一致 ${errCount}件</span>`)
    : '';
  infoEl.innerHTML = balanceLabel
    ? `<div style="display:flex;gap:16px;align-items:center;padding:10px 0;font-size:0.9rem">${balanceLabel}</div>`
    : '';

  const tbody = document.getElementById('bankbook-tbody');
  tbody.innerHTML = bankbookData.map((r, i) => {
    const isNG    = r.check && r.check.startsWith('残高不一致');
    const isFixed = r.autoFixed;
    const isDismissed = !r.check && r.prevCheck;
    const isAccepted  = r.acceptedCalc && r.prevBalance != null;
    const btnCalc       = `<button onclick="acceptCalculated(${i})" style="margin-left:6px;padding:2px 8px;font-size:0.75rem;background:#38a169;color:#fff;border:none;border-radius:3px;cursor:pointer">✓ 計算値が正しい</button>`;
    const btnDismiss    = `<button onclick="dismissError(${i})" style="margin-left:4px;padding:2px 8px;font-size:0.75rem;background:#718096;color:#fff;border:none;border-radius:3px;cursor:pointer">✕ 解除</button>`;
    const btnUndo       = `<button onclick="undoDismiss(${i})" style="padding:2px 8px;font-size:0.75rem;background:#e2e8f0;color:#4a5568;border:none;border-radius:3px;cursor:pointer">↩ 元に戻す</button>`;
    const btnUndoCalc   = `<button onclick="undoAcceptCalculated(${i})" style="margin-left:6px;padding:2px 8px;font-size:0.75rem;background:#e2e8f0;color:#4a5568;border:none;border-radius:3px;cursor:pointer">↩ 元に戻す</button>`;
    const checkCell = r.check === 'OK'
      ? (isFixed    ? '<span class="check-fixed">↔ 自動修正</span>'
       : isAccepted ? `<span class="check-ok">OK</span>${btnUndoCalc}`
       :              '<span class="check-ok">OK</span>')
      : isNG ? `<span class="check-ng">${esc(r.check)}</span>${r.calculatedBalance != null ? btnCalc : ''}${btnDismiss}`
      : isDismissed ? btnUndo : '';
    return `<tr class="${isNG ? 'row-error' : isFixed ? 'row-autofixed' : ''}">
      <td style="color:#a0aec0;font-size:0.8rem;white-space:nowrap">P.${r.page ?? ''}</td>
      <td contenteditable="true" data-idx="${i}" data-field="date">${esc(r.date)}</td>
      <td contenteditable="true" data-idx="${i}" data-field="withdrawal">${esc(String(r.withdrawal))}</td>
      <td contenteditable="true" data-idx="${i}" data-field="deposit">${esc(String(r.deposit))}</td>
      <td contenteditable="true" data-idx="${i}" data-field="balance">${esc(String(r.balance))}</td>
      <td contenteditable="true" data-idx="${i}" data-field="description">${esc(r.description)}</td>
      <td>${checkCell}</td>
      <td style="white-space:nowrap"><button class="btn-del-row" onclick="deleteBankbookRow(${i})">削除</button><button class="btn-ins-row" onclick="insertBankbookRow(${i})">挿入</button></td>
    </tr>`;
  }).join('');

  bindEditable(tbody, bankbookData);
  document.getElementById('bankbook-count').textContent = bankbookData.length;
  document.getElementById('bankbook-results').style.display = 'block';
}

function deleteBankbookRow(i) {
  pushUndo('bankbook', { type: 'delete', index: i, row: Object.assign({}, bankbookData[i]) });
  bankbookData.splice(i, 1);
  const errCount = runBalanceCheck();
  renderBankbookTable(errCount);
}

function insertBankbookRow(i) {
  const newRow = { date: '', withdrawal: '', deposit: '', balance: '', description: '', page: '-', check: '' };
  bankbookData.splice(i + 1, 0, newRow);
  pushUndo('bankbook', { type: 'insert', index: i + 1 });
  const errCount = runBalanceCheck();
  renderBankbookTable(errCount);
}

function downloadCSVBankbook() {
  const BOM = '﻿';
  let csv = BOM + 'ページ,日付,出金,入金,残高,摘要\n';
  let running = null;
  bankbookData.forEach(r => {
    const dep = Math.round(parseFloat(r.deposit)    || 0);
    const wd  = Math.round(parseFloat(r.withdrawal) || 0);
    if (running !== null) running = running + dep - wd;
    const printed = (r.balance !== '' && r.balance != null) ? Math.round(parseFloat(r.balance)) : null;
    if (printed !== null) running = printed;
    const balOut = printed !== null ? printed : (running !== null ? running : '');
    csv += [r.page ?? '', r.date, r.withdrawal, r.deposit, balOut, r.description].map(csvField).join(',') + '\n';
  });
  downloadFile(csv, toCsvFilename(bankbookFileNames, '通帳.csv'));
}

// ═══════════════════════════════════════════════════════════
//  FEATURE ③  CARD STATEMENT
// ═══════════════════════════════════════════════════════════
const CARD_PROMPT = `あなたは会計書類OCRの専門家です。このカード明細の画像から全ての利用明細を抽出してください。

必ず以下のJSON形式だけで回答してください（説明文・コードブロック不要）:
{
  "items": [
    {
      "date": "YYYY/MM/DD",
      "amount": 数値,
      "description": "利用先・店名"
    }
  ],
  "total": 数値またはnull
}

抽出ルール:
- date: 和暦を西暦変換、月日のみなら文脈から年を補完
- amount: 利用金額（整数値、カンマなし）
- description: 利用先・店名・摘要
- total: ご請求合計・明細合計が記載されていれば数値、なければnull
- 全ての個別利用明細行を漏らさず抽出すること

【items に絶対に含めてはいけない行】
- 「今月ご利用額」「ご請求金額」「ご請求合計」「合計額」「小計」「合計」を含む行
- 氏名（〇〇様）と金額だけの行（例：「加藤 智之 様 今月ご利用額」）
- 「その他ご請求分」「繰越残高」「お支払金額」等の請求サマリ行
- ヘッダー行・説明行・注記行
これらは total フィールドにのみ反映すること

【摘要の簡略化ルール】
- ETCの場合：カード番号（ETC NO）・入口・出口・道路の重複情報を除き「ETC {道路会社名}」のみにすること（例：「ETC 首都高速道路」「ETC 東日本高速道路 関東支社」）`;

let cardData      = [];
let cardTotals    = [];
let cardFileNames = [];

async function handleCardUpload(event) {
  const files = Array.from(event.target.files);
  event.target.value = '';
  if (!files.length) return;

  clearError('card');
  cardData      = [];
  cardTotals    = [];
  cardFileNames = files.map(f => f.name);
  tabCost.card  = 0;
  resetAbort();

  try {
    const allImgs = [];
    for (const f of files) {
      showProgress('card', `ファイル読み込み中: ${f.name}`, 5);
      const imgs = await fileToImages(f);
      allImgs.push(...imgs);
    }

    const total = allImgs.length;
    if (total === 0) throw new Error('画像を取得できませんでした');

    const pageErrors = [];
    const startTime = Date.now();
    let completed = 0;

    const pageResults = await runWithConcurrency(allImgs.map((img, i) => async () => {
      if (abortFlag) return null;
      try {
        const result = await callGemini(CARD_PROMPT, img.data, img.mime, 2, 'card');
        return { result, page: i + 1 };
      } catch (e) {
        if (e.message.includes('APIキー') || e.message.includes('レート制限') || e.message.includes('無効')) throw e;
        pageErrors.push(`ページ ${i + 1} 要確認（2回失敗しスキップ）: ${e.message}`);
        return null;
      } finally {
        completed++;
        const elapsed = Math.round((Date.now() - startTime) / 1000);
        showProgress('card', `${completed} / ${total} ページ処理中... 経過${elapsed}秒`, Math.round(10 + completed / total * 85));
      }
    }), CONCURRENCY);

    for (const pageItem of pageResults) {
      if (!pageItem) continue;
      const { result, page } = pageItem;
      for (const item of (result.items || [])) {
        if (!item.date && item.amount == null) continue;
        const d = item.description ?? '';
        if (/今月ご利用額|ご請求金額|ご請求合計|合計額|その他ご請求分|繰越残高|お支払金額/.test(d)) continue;
        if (/^.{1,10}様/.test(d)) continue;
        cardData.push({
          page,
          date:        item.date        ?? '',
          amount:      item.amount      != null ? item.amount : '',
          description: item.description ?? ''
        });
      }
      if (result.total != null) cardTotals.push(result.total);
    }

    showProgress('card', abortFlag ? '中止しました' : '完了', 100);
    await sleep(400);
    hideProgress('card');
    if (pageErrors.length) showError('card', pageErrors.join('\n'));
    renderCardTable();
    renderFilename('card', cardFileNames);
    updateCostBadge('card');

  } catch (e) {
    hideProgress('card');
    showError('card', e.message);
  }
}

function renderCardTable() {
  const tbody = document.getElementById('card-tbody');
  tbody.innerHTML = cardData.map((r, i) => `
    <tr>
      <td style="color:#a0aec0;font-size:0.8rem;white-space:nowrap">P.${r.page ?? ''}</td>
      <td contenteditable="true" data-idx="${i}" data-field="date">${esc(r.date)}</td>
      <td contenteditable="true" data-idx="${i}" data-field="amount">${esc(String(r.amount))}</td>
      <td contenteditable="true" data-idx="${i}" data-field="description">${esc(r.description)}</td>
      <td><button class="btn-del-row" onclick="deleteCardRow(${i})">削除</button><button class="btn-ins-row" onclick="insertCardRow(${i})">挿入</button></td>
    </tr>`).join('');

  bindEditable(tbody, cardData);

  // Summary check
  const sumEl = document.getElementById('card-summary');
  if (cardTotals.length > 0) {
    const extracted = cardData.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
    const reported  = cardTotals[cardTotals.length - 1];
    const diff      = Math.abs(extracted - reported);
    const match     = diff < 1;
    sumEl.innerHTML = `<div class="alert ${match ? 'alert-info' : 'alert-warn'}">
      明細合計: <strong>¥${extracted.toLocaleString()}</strong> ／ 請求合計: <strong>¥${reported.toLocaleString()}</strong>
      → ${match ? '<span style="color:#059669">✓ 一致</span>' : `<span style="color:#e53e3e">⚠ 差異 ¥${diff.toLocaleString()}</span>`}
    </div>`;
  } else {
    sumEl.innerHTML = '';
  }

  document.getElementById('card-count').textContent = cardData.length;
  document.getElementById('card-results').style.display = 'block';
}

function deleteCardRow(i) {
  pushUndo('card', { type: 'delete', index: i, row: Object.assign({}, cardData[i]) });
  cardData.splice(i, 1);
  renderCardTable();
}

function insertCardRow(i) {
  const newRow = { date: '', amount: '', description: '', page: '-' };
  cardData.splice(i + 1, 0, newRow);
  pushUndo('card', { type: 'insert', index: i + 1 });
  renderCardTable();
}

function downloadCSVCard() {
  const BOM = '﻿';
  let csv = BOM + 'ページ,日付,出金,摘要\n';
  cardData.forEach(r => {
    csv += [r.page ?? '', r.date, r.amount, r.description].map(csvField).join(',') + '\n';
  });
  downloadFile(csv, toCsvFilename(cardFileNames, 'カード明細.csv'));
}

// ─── Unified CSV dispatch ─────────────────────────────────
function downloadCSV(tab) {
  if (tab === 'receipt')  return downloadCSVReceipt();
  if (tab === 'bankbook') return downloadCSVBankbook();
  if (tab === 'card')     return downloadCSVCard();
}

function acceptCalculated(i) {
  bankbookData[i].prevBalance = bankbookData[i].balance;
  bankbookData[i].acceptedCalc = true;
  bankbookData[i].balance = bankbookData[i].calculatedBalance;
  bankbookData[i].calculatedBalance = null;
  const errCount = runBalanceCheck();
  renderBankbookTable(errCount);
}

function undoAcceptCalculated(i) {
  bankbookData[i].balance = bankbookData[i].prevBalance;
  bankbookData[i].prevBalance = null;
  bankbookData[i].acceptedCalc = false;
  const errCount = runBalanceCheck();
  renderBankbookTable(errCount);
}

function dismissError(i) {
  bankbookData[i].prevCheck = bankbookData[i].check;
  bankbookData[i].check = '';
  const errCount = bankbookData.filter(r => r.check && r.check.startsWith('残高不一致')).length;
  renderBankbookTable(errCount);
}

function undoDismiss(i) {
  bankbookData[i].check = bankbookData[i].prevCheck || '';
  bankbookData[i].prevCheck = null;
  const errCount = bankbookData.filter(r => r.check && r.check.startsWith('残高不一致')).length;
  renderBankbookTable(errCount);
}

function recheckBalance() {
  if (!bankbookData.length) return;
  const errCount = runBalanceCheck();
  renderBankbookTable(errCount);
  const done = document.getElementById('recheck-done');
  if (done) { done.style.display = 'inline'; setTimeout(() => { done.style.display = 'none'; }, 3000); }
}

// ─── Clear results ────────────────────────────────────────
function clearResults(tab) {
  clearError(tab);
  undoStack[tab] = [];
  updateUndoBtn(tab);
  if (tab === 'receipt') {
    receiptData = []; receiptFileNames = [];
    document.getElementById('receipt-results').style.display = 'none';
    document.getElementById('receipt-filename').innerHTML = '';
  } else if (tab === 'bankbook') {
    bankbookData = []; bankbookFileNames = [];
    document.getElementById('bankbook-results').style.display = 'none';
    document.getElementById('bankbook-balance-info').innerHTML = '';
    document.getElementById('bankbook-filename').innerHTML = '';
    const rb = document.getElementById('btn-recheck');
    if (rb) rb.remove();
  } else if (tab === 'card') {
    cardData = []; cardTotals = []; cardFileNames = [];
    document.getElementById('card-results').style.display = 'none';
    document.getElementById('card-summary').innerHTML = '';
    document.getElementById('card-filename').innerHTML = '';
  }
}
